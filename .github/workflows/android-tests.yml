# Runs the smoke tests on an Android emulator for every push / pull request.
name: Android tests
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-automation   # the project lives in this sub-folder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Install Appium and Python packages
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install -r requirements.txt

      - name: Download demo app
        run: |
          mkdir -p apps
          URL=$(curl -fsSL https://api.github.com/repos/appium/android-apidemos/releases/latest \
                | grep -o '"browser_download_url": *"[^"]*ApiDemos-debug.apk"' | head -1 | cut -d'"' -f4)
          curl -fsSL -o apps/ApiDemos-debug.apk "$URL"

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          working-directory: mobile-automation
          script: python -m pytest -m smoke

      - name: Build Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate reports/allure-results -o reports/allure-report --clean || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: mobile-automation/reports/
